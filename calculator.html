<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shreya's Calculator</title>
    <!--The css was just written in the same file and below is the code for it -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height : 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0B1D3A 0%, #1D4E6B 40%, #478F76 70%, #A3D2A9 100%);
            font-family: 'DM Mono', monospace;
        }

        .calc {
            background : rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding : 24px;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .display {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            padding : 16px 20px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .display .expr {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.35);
            min-height: 18px;
            margin-bottom: 4px;
        }

        .display .main {
            font-size: 36px;
            font-weight: 500;
            color: #1a1a1a;
            word-break: break-all;
            line-height: 1.1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 14px;
            font-family: 'DM Mono', monospace;
            font-size: 18px;
            font-weight: 500;
            padding: 0;
            height: 58px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.1s;
            color: #1a1a1a;
        }

        .btn:active { transform: scale(0.93); opacity: 0.85; }
        .btn-num  { background: rgba(255, 255, 255, 0.8); }
        .btn-zero { grid-column: span 3; font-size: 20px; background: rgba(255, 255, 255, 0.8); }
        .btn-op   { background: #e8417a; color: white; }
        .btn-op:active { background: #c0336a; }
        .btn-clear { background: rgba(255, 255, 255, 0.6); grid-column: span 2; }
        .btn-back  { background: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body>
    <div class="calc" role="application" aria-label="Calculator">
        <div class="display">
            <div class="expr" id="expr"></div>
            <div class="main" id="main">0</div>
        </div>
        <div class="grid">
            <!--Following are all the buttons that will be appearing on the display-->
            <button class="btn btn-clear" onclick="clearAll()">C</button>
            <button class="btn btn-back" onclick="backspace()">←</button>
            <button class="btn btn-op" onclick="setOp('÷')">÷</button>

            <button class="btn btn-num" onclick="appendNum('7')">7</button>
            <button class="btn btn-num" onclick="appendNum('8')">8</button>
            <button class="btn btn-num" onclick="appendNum('9')">9</button>
            <button class="btn btn-op" onclick="setOp('x')">x</button>

            <button class="btn btn-num" onclick="appendNum('4')">4</button>
            <button class="btn btn-num" onclick="appendNum('5')">5</button>
            <button class="btn btn-num" onclick="appendNum('6')">6</button>
            <button class="btn btn-op" onclick="setOp('-')">-</button>

            <button class="btn btn-num" onclick="appendNum('1')">1</button>
            <button class="btn btn-num" onclick="appendNum('2')">2</button>
            <button class="btn btn-num" onclick="appendNum('3')">3</button>
            <button class="btn btn-op" onclick="setOp('+')">+</button>

            <button class="btn btn-zero" onclick="appendNum('0')">0</button>
            <button class="btn btn-op" onclick="calculate()">=</button>
        </div>
    </div>
    <!--The javascript was just written in the same file and below is the code for it -->
    <script>
        let current = '0', prev = '', op = null, resetNext = false;
        const mainEl = document.getElementById('main');
        const exprEl = document.getElementById('expr');

        function updateDisplay() {
            mainEl.textContent = current.length > 10
                ? parseFloat(parseFloat(current).toPrecision(8)).toString()
                : current;
        }

        function appendNum(n) {
            if (resetNext) { current = n; resetNext = false; }
            else current = current === '0' ? n : current + n;
            updateDisplay();
        }

        function setOp(o) {
            if (op && !resetNext) calculate();
            prev = current;
            op = o;
            resetNext = true;
            exprEl.textContent = prev + ' ' + op;
        }

        function calculate() {
            if (!op || resetNext) return;
            let a = parseFloat(prev), b = parseFloat(current), r;
            if      (op === '+') r = a + b;
            else if (op === '-') r = a - b;
            else if (op === 'x') r = a * b;
            else if (op === '÷') r = b !== 0 ? a / b : 'Error';
            exprEl.textContent = prev + ' ' + op + ' ' + current + ' =';
            current = r === 'Error' ? 'Error' : parseFloat(r.toPrecision(10)).toString();
            op = null;
            resetNext = true;
            updateDisplay();
        }

        function clearAll() {
            current = '0'; prev = ''; op = null; resetNext = false;
            exprEl.textContent = '';
            updateDisplay();
        }

        function backspace() {
            if (resetNext || current === 'Error') { current = '0'; resetNext = false; }
            else current = current.length > 1 ? current.slice(0, -1) : '0';
            updateDisplay();
        }
    </script>
</body>
</html>
